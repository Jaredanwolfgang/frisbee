server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header Cache-Control "no-cache" always;

    client_max_body_size 5m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location = /api/ai/rules {
        set $frisbee_ai_api frisbee-api:8080;
        proxy_pass http://$frisbee_ai_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_pass_header X-Accel-Buffering;
        proxy_read_timeout 150s;
    }

    location = /api/ai/tactic {
        set $frisbee_ai_api frisbee-api:8080;
        proxy_pass http://$frisbee_ai_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_pass_header X-Accel-Buffering;
        proxy_read_timeout 150s;
    }

    location = /api/ai/outline {
        set $frisbee_ai_api frisbee-api:8080;
        proxy_pass http://$frisbee_ai_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_pass_header X-Accel-Buffering;
        proxy_read_timeout 150s;
    }

    location /api/ {
        set $frisbee_api frisbee-api:8080;
        proxy_pass http://$frisbee_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 25s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
